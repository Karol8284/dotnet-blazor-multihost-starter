name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-tests:
    name: Web build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blazor_multihost_starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d blazor_multihost_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      - name: Restore Web and test dependencies
        run: |
          dotnet tool restore
          dotnet restore src/BlazorMultihostStarter.Web/BlazorMultihostStarter.Web.csproj
          dotnet restore tests/BlazorMultihostStarter.Domain.Tests/BlazorMultihostStarter.Domain.Tests.csproj
          dotnet restore tests/BlazorMultihostStarter.Application.Tests/BlazorMultihostStarter.Application.Tests.csproj
          dotnet restore tests/BlazorMultihostStarter.Api.IntegrationTests/BlazorMultihostStarter.Api.IntegrationTests.csproj
          dotnet restore tests/BlazorMultihostStarter.Shared.Tests/BlazorMultihostStarter.Shared.Tests.csproj

      - name: Build Web host
        run: dotnet build src/BlazorMultihostStarter.Web/BlazorMultihostStarter.Web.csproj --configuration Release --no-restore

      - name: Check EF Core migration model
        run: dotnet ef migrations has-pending-model-changes --project src/BlazorMultihostStarter.Infrastructure/BlazorMultihostStarter.Infrastructure.csproj --startup-project src/BlazorMultihostStarter.Web/BlazorMultihostStarter.Web.csproj --context BlazorMultihostStarter.Infrastructure.Data.StarterDbContext

      - name: Test domain and application
        run: |
          dotnet test tests/BlazorMultihostStarter.Domain.Tests/BlazorMultihostStarter.Domain.Tests.csproj --configuration Release
          dotnet test tests/BlazorMultihostStarter.Application.Tests/BlazorMultihostStarter.Application.Tests.csproj --configuration Release

      - name: Test API against PostgreSQL
        run: dotnet test tests/BlazorMultihostStarter.Api.IntegrationTests/BlazorMultihostStarter.Api.IntegrationTests.csproj --configuration Release
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=blazor_multihost_starter;Username=starter;Password=starter_dev_password

      - name: Test shared Razor components
        run: dotnet test tests/BlazorMultihostStarter.Shared.Tests/BlazorMultihostStarter.Shared.Tests.csproj --configuration Release

  maui-windows:
    name: MAUI Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      - name: Restore MAUI workloads
        run: dotnet workload restore src/BlazorMultihostStarter.Maui/BlazorMultihostStarter.Maui.csproj

      - name: Build MAUI Windows target
        run: dotnet build src/BlazorMultihostStarter.Maui/BlazorMultihostStarter.Maui.csproj --framework net10.0-windows10.0.19041.0 --configuration Release

      - name: Build MAUI Android target
        run: dotnet build src/BlazorMultihostStarter.Maui/BlazorMultihostStarter.Maui.csproj --framework net10.0-android --configuration Debug

      - name: Install and generate project template
        shell: pwsh
        run: |
          dotnet new install . --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $generated = Join-Path $env:RUNNER_TEMP 'TemplateSmokeApp'
          dotnet new blazor-multihost-starter `
            --name TemplateSmokeApp `
            --output $generated `
            --no-update-check `
            --appTitle 'Template Smoke' `
            --mauiBundleId 'com.example.templatesmoke' `
            --tenantId '11111111-1111-4111-8111-111111111111' `
            --apiClientId '22222222-2222-4222-8222-222222222222' `
            --webClientId '33333333-3333-4333-8333-333333333333' `
            --mauiClientId '44444444-4444-4444-8444-444444444444' `
            --serverClientId '55555555-5555-4555-8555-555555555555'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem -LiteralPath $generated -Recurse -File -Include '*.cs','*.json','*.csproj','*.plist'
          $unresolved = $files | Select-String -Pattern '__[A-Z0-9_]+__'
          if ($unresolved) {
            $unresolved
            throw 'The generated template contains unresolved placeholders.'
          }

      - name: Build generated Web and MAUI projects
        shell: pwsh
        run: |
          $generated = Join-Path $env:RUNNER_TEMP 'TemplateSmokeApp'
          dotnet build (Join-Path $generated 'src\TemplateSmokeApp.Web\TemplateSmokeApp.Web.csproj') --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build (Join-Path $generated 'src\TemplateSmokeApp.Maui\TemplateSmokeApp.Maui.csproj') --framework net10.0-windows10.0.19041.0 --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
