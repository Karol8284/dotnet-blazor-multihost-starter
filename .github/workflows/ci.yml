name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-tests:
    name: Web build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blazor_multihost_starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d blazor_multihost_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      - name: Restore Web and test dependencies
        run: |
          dotnet tool restore
          dotnet restore src/BlazorMultihostStarter.Web/BlazorMultihostStarter.Web.csproj
          dotnet restore tests/BlazorMultihostStarter.Domain.Tests/BlazorMultihostStarter.Domain.Tests.csproj
          dotnet restore tests/BlazorMultihostStarter.Application.Tests/BlazorMultihostStarter.Application.Tests.csproj
          dotnet restore tests/BlazorMultihostStarter.Api.IntegrationTests/BlazorMultihostStarter.Api.IntegrationTests.csproj
          dotnet restore tests/BlazorMultihostStarter.Shared.Tests/BlazorMultihostStarter.Shared.Tests.csproj

      - name: Build Web host
        run: dotnet build src/BlazorMultihostStarter.Web/BlazorMultihostStarter.Web.csproj --configuration Release --no-restore

      - name: Check EF Core migration model
        run: dotnet ef migrations has-pending-model-changes --project src/BlazorMultihostStarter.Infrastructure/BlazorMultihostStarter.Infrastructure.csproj --startup-project src/BlazorMultihostStarter.Web/BlazorMultihostStarter.Web.csproj --context BlazorMultihostStarter.Infrastructure.Data.StarterDbContext

      - name: Test domain and application
        run: |
          dotnet test tests/BlazorMultihostStarter.Domain.Tests/BlazorMultihostStarter.Domain.Tests.csproj --configuration Release
          dotnet test tests/BlazorMultihostStarter.Application.Tests/BlazorMultihostStarter.Application.Tests.csproj --configuration Release

      - name: Test API against PostgreSQL
        run: dotnet test tests/BlazorMultihostStarter.Api.IntegrationTests/BlazorMultihostStarter.Api.IntegrationTests.csproj --configuration Release
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=blazor_multihost_starter;Username=starter;Password=starter_dev_password

      - name: Test shared Razor components
        run: dotnet test tests/BlazorMultihostStarter.Shared.Tests/BlazorMultihostStarter.Shared.Tests.csproj --configuration Release

  maui-windows:
    name: MAUI Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      - name: Restore MAUI workloads
        run: dotnet workload restore src/BlazorMultihostStarter.Maui/BlazorMultihostStarter.Maui.csproj

      - name: Build MAUI Windows target
        run: dotnet build src/BlazorMultihostStarter.Maui/BlazorMultihostStarter.Maui.csproj --framework net10.0-windows10.0.19041.0 --configuration Release

      - name: Build MAUI Android target
        run: dotnet build src/BlazorMultihostStarter.Maui/BlazorMultihostStarter.Maui.csproj --framework net10.0-android --configuration Debug

      - name: Generate PascalCase and kebab-case project templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $templateRoot = Join-Path $env:RUNNER_TEMP 'BlazorMultihostTemplateSmoke'
          $templateHive = Join-Path $templateRoot 'hive'
          $null = New-Item -ItemType Directory -Path $templateRoot -Force
          dotnet new --debug:custom-hive $templateHive install . --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cases = @(
            @{
              Name = 'ContosoTasks'
              AppTitle = 'Contoso Tasks'
              BundleId = 'com.example.contosotasks'
            },
            @{
              Name = 'blazor-multihost-starter'
              AppTitle = 'Blazor Multihost Starter'
              BundleId = 'com.example.blazormultihoststarter'
            }
          )

          foreach ($case in $cases) {
            $generated = Join-Path $templateRoot $case.Name
            dotnet new --debug:custom-hive $templateHive blazor-multihost-starter `
              --name $case.Name `
              --output $generated `
              --no-update-check `
              --appTitle $case.AppTitle `
              --mauiBundleId $case.BundleId `
              --tenantId '11111111-1111-4111-8111-111111111111' `
              --apiClientId '22222222-2222-4222-8222-222222222222' `
              --webClientId '33333333-3333-4333-8333-333333333333' `
              --mauiClientId '44444444-4444-4444-8444-444444444444' `
              --serverClientId '55555555-5555-4555-8555-555555555555'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $solution = Join-Path $generated "$($case.Name).sln"
            if (-not (Test-Path -LiteralPath $solution -PathType Leaf)) {
              throw "Generated solution not found for '$($case.Name)': $solution"
            }

            $solutionProjects = dotnet sln $solution list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $projectFiles = $solutionProjects |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_.EndsWith('.csproj', [StringComparison]::OrdinalIgnoreCase) }
            if (-not $projectFiles) {
              throw "No project files were listed for '$($case.Name)'."
            }

            foreach ($projectFile in $projectFiles) {
              $normalizedProjectFile = $projectFile.Replace('/', [System.IO.Path]::DirectorySeparatorChar)
              $projectPath = Join-Path $generated $normalizedProjectFile
              if (-not (Test-Path -LiteralPath $projectPath -PathType Leaf)) {
                throw "Solution project path does not exist for '$($case.Name)': $projectFile"
              }
            }

            $textExtensions = @(
              '.cs', '.csx', '.razor', '.css', '.html', '.htm', '.js', '.mjs', '.ts', '.tsx',
              '.jsx', '.json', '.xml', '.xaml', '.csproj', '.sln', '.slnx', '.props', '.targets',
              '.plist', '.resx', '.md', '.txt', '.config', '.yml', '.yaml', '.toml', '.ini',
              '.sh', '.ps1', '.cmd', '.bat', '.gradle', '.kts', '.entitlements', '.manifest',
              '.svg'
            )
            $textFiles = Get-ChildItem -LiteralPath $generated -Recurse -File |
              Where-Object {
                $_.Extension -in $textExtensions -or
                $_.Name -in @('.editorconfig', '.gitignore', '.gitattributes', 'Dockerfile', 'LICENSE')
              }
            $unresolved = $textFiles | Select-String -Pattern '__[A-Z0-9_]+__'
            if ($unresolved) {
              $unresolved
              throw "The generated '$($case.Name)' template contains unresolved placeholders."
            }
          }

      - name: Build generated PascalCase and kebab-case projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $templateRoot = Join-Path $env:RUNNER_TEMP 'BlazorMultihostTemplateSmoke'
          foreach ($projectName in @('ContosoTasks', 'blazor-multihost-starter')) {
            $generated = Join-Path $templateRoot $projectName
            dotnet build (Join-Path $generated "src\$projectName.Web\$projectName.Web.csproj") --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build (Join-Path $generated "src\$projectName.Maui\$projectName.csproj") --framework net10.0-windows10.0.19041.0 --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
